debug_pid_package:
  input_boolean:
    test_inner_on_off_cooler:
    test_inner_on_off_heater:

    test_thermostat_on_off_cooler:
    test_thermostat_on_off_heater:

    test_number_thermostat_cooler_switch:
    test_number_thermostat_heater_switch:

  input_number:
    test_inner_thermostat_cooler_sensor:
      min: 5
      max: 40
      step: 0.1
      initial: 40
    test_inner_thermostat_heater_sensor:
      min: 5
      max: 40
      step: 0.1
      initial: 5
    test_thermostat_sensor:
      min: 5
      max: 40
      step: 0.1
    test_number_thermostat_cooler:
      min: 7
      max: 35
    test_number_thermostat_heater:
      min: 7
      max: 35

  climate:
    - platform: generic_thermostat
      name: test_inner_cooler
      target_sensor: input_number.test_inner_thermostat_cooler_sensor
      heater: input_boolean.test_inner_on_off_cooler
      ac_mode: true
    - platform: generic_thermostat
      name: test_inner_heater
      target_sensor: input_number.test_inner_thermostat_heater_sensor
      heater: input_boolean.test_inner_on_off_heater


    # The thermostat under test is created from the UI (pid_pwm_smart_thermostat is UI-only):
    # name it "test_thermostat" (-> climate.test_thermostat, used by debug_lovelace_dashboard.yaml),
    # sensor input_number.test_thermostat_sensor, then add:
    #   coolers: input_boolean.test_thermostat_on_off_cooler (on/off),
    #            climate.test_inner_cooler (PID 0.2/0.1/0, sample period 10s),
    #            input_number.test_number_thermostat_cooler (PID 0.2/0.1/0, sample period 10s,
    #              switch input_boolean.test_number_thermostat_cooler_switch)
    #   heaters: the same with the *_heater entities.

